# Disposable test server, never use this trust configuration for production.
name: fisiomove-tests
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fisiomove_test
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${FISIOMOVE_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fisiomove_test -d postgres]
      interval: 2s
      timeout: 3s
      retries: 20
