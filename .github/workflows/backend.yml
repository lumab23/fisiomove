name: Backend PostgreSQL
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: fisiomove_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fisiomove_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FISIOMOVE_TEST_POSTGRES_URL: postgresql+psycopg://fisiomove_test@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=/tmp/backend-results.xml
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: backend-postgresql-results
          path: /tmp/backend-results.xml
